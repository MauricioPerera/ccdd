ccdd_version: "0.1"
contract:
  name: "support-agent"
  budget:
    model: "claude-opus-4-8"
    max_tokens: 550           # bajo a propósito, para que el demo muestre truncamiento
    reserve_output: 200
  slots:
    - id: environment
      priority: 0
      source: { type: static, path: "env.txt", sign: true }
      compaction: none
      min_tokens: 20
    - id: system
      priority: 1
      source: { type: static, path: "system.txt", sign: true }
      compaction: none
      min_tokens: 40
    - id: policies
      priority: 1
      source: { type: static, path: "policies.txt", sign: true }
      compaction: none
      min_tokens: 40
    - id: memory
      priority: 2
      source: { type: dynamic, provider: "session_memory" }
      compaction: summarize
      max_tokens: 300
    - id: rag
      priority: 3
      source: { type: dynamic, provider: "vector_search" }
      compaction: truncate
      max_tokens: 400
    - id: user_message
      priority: 4
      source: { type: runtime }
      compaction: truncate
  guardrails:
    - id: no-secrets
      type: regex_deny
      pattern: "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})"
      on_fail: abort
    - id: slot-references
      type: reference_check
      on_fail: abort

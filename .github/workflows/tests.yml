name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml jsonschema cryptography
      - name: Run reference test suite (44 tests)
        working-directory: ccdd_reference
        run: python -m unittest discover -s tests -p "test_*.py" -v
